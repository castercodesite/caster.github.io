title: "Caster's Coding Blog"
description: "Coding notes and project write-ups"
remote_theme: "mmistakes/so-simple-theme@3.2.0"

plugins:
  - jekyll-remote-theme

logo: "https://castercodesite.github.io/caster.github.io/assets/images/Mint%20Pixel-Terminal%20C%20Logo.png"

google_fonts:
  - name: "Titillium Web"
    weights: "400,700"
  - name: "Source Sans Pro"
    weights: "400,700"

category_archive_path: "/posts/#"
date_format: "%Y-%m-%d"

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      author: caster
